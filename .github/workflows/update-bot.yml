name: Update bot

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Telegram request ID (leave blank for a browser-initiated update)
        required: false
      release_tag:
        description: Published stable gramless/support release
        required: true

permissions:
  contents: read

concurrency:
  group: telegram-bot-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      REQUEST_ID: ${{ inputs.request_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve published upstream release
        id: release
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh api "repos/gramless/support/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$RELEASE_TAG" '.draft == false and .prerelease == false and .tag_name == $tag' "$RUNNER_TEMP/release.json"
          sha=$(gh api "repos/gramless/support/commits/$RELEASE_TAG" --jq .sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out selected release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gramless/support
          ref: ${{ steps.release.outputs.sha }}
          path: release
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Deploy selected release and report to Telegram
        run: node scripts/update-bot.mjs release/tgcloud
